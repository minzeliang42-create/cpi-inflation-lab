name: Publish display-only revision
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', 'cpi/pce_history.py', 'cpi/pce_growth.py', 'tests/test_pce_growth.py', 'tests/test_pce_growth.mjs', 'scripts/publish_history.py', 'tests/test_history.mjs', 'tests/test_frontend.mjs', 'cpi/card_estimates.py', 'tests/test_card_estimates.py', 'tests/test_card_frontend.mjs', '.github/workflows/display.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: cpi-display-pages
  cancel-in-progress: false
jobs:
  display:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate browser helpers
        run: |
          node --check web/app.js
          node --check web/history.js
          node tests/test_history.mjs
          node tests/test_pce_growth.mjs
          node --check web/pce-growth.js

          node tests/test_frontend.mjs
          node tests/test_card_frontend.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests openpyxl
      - name: Update independent PCE history (retain last good on failure)
        if: github.event_name == 'workflow_dispatch'
        run: python -m cpi.pce_history
      - name: Build isolated nonofficial card estimates
        run: |
          python -m unittest discover -s tests -p test_card_estimates.py -v
          python -m cpi.card_estimates
          python -m unittest discover -s tests -p test_pce_growth.py -v
      - name: Publish historical allowlist
        run: python scripts/publish_history.py
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - name: Allow artifact metadata to become visible
        run: sleep 10
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
