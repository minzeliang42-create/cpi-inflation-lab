name: Update CPI research and deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['cpi/**', 'web/**', 'tests/**', 'requirements.txt', '.github/workflows/**']
  schedule:
    - cron: '25 22 * * *'
    - cron: '40 12-18 * * 1-5'
permissions:
  contents: write
concurrency:
  group: cpi-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.artifact.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - name: Import existing reviewed project (first run only)
        run: |
          if [ ! -f cpi/model.py ]; then
            python - <<'PY'
          import hashlib, pathlib, zipfile
          archive = pathlib.Path('source/source-seed.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '914af8bab6657000632b34fb593a0c089e416a5279b48dba0e3924081a09c5d6'
          root = pathlib.Path.cwd().resolve()
          with zipfile.ZipFile(archive) as bundle:
              for item in bundle.infolist():
                  rel = pathlib.PurePosixPath(item.filename).relative_to('cpi-inflation-lab')
                  assert not rel.is_absolute() and '..' not in rel.parts
                  if rel.parts[0] == '.github':
                      continue
                  target = root.joinpath(*rel.parts)
                  assert target.resolve().is_relative_to(root)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(bundle.read(item))
          PY
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate code and seeded history
        run: |
          python -m cpi.build
          python -m unittest discover -s tests -v
      - name: Check official BLS data
        id: update
        continue-on-error: true
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "25 22 * * *" ]; then
            python -m cpi.update --release-window
          else
            python -m cpi.update
          fi
      - name: Verify generated release
        run: python -m unittest discover -s tests -v
      - name: Save data and update log
        if: always()
        run: |
          git config user.name "cpi-research-bot"
          git config user.email "cpi-research-bot@users.noreply.github.com"
          git add cpi scripts tests web data dist README.md VALIDATION.md requirements.txt .gitignore
          if ! git diff --cached --quiet; then
            git commit -m "Update official CPI data and research release"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        id: artifact
        with:
          path: dist
      - name: Report update failure
        if: steps.update.outcome == 'failure'
        run: |
          echo "Official update failed; last good dataset retained. Inspect data/updates and dist/status.json."
          exit 1
  deploy:
    # Public website explicitly approved by the owner on 2026-11-13.
    if: always() && needs.research.outputs.ready == 'true'
    needs: research
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
